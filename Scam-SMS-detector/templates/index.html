 <!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Scam SMS Detector</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins', sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:
            radial-gradient(circle at top left,#00c6ff33,transparent 25%),
            radial-gradient(circle at bottom right,#7f5af033,transparent 25%),
            linear-gradient(135deg,#0f172a,#111827,#020617);
            overflow:hidden;
            color:white;
        }

        .bg-animation{
            position:absolute;
            width:500px;
            height:500px;
            border-radius:50%;
            background:#00c6ff20;
            filter:blur(100px);
            animation:float 8s infinite alternate;
        }

        .bg-animation:nth-child(2){
            background:#7f5af020;
            right:-100px;
            bottom:-100px;
            animation-duration:10s;
        }

        @keyframes float{
            from{
                transform:translateY(-30px);
            }

            to{
                transform:translateY(30px);
            }
        }

        .container{
            position:relative;
            width:700px;
            padding:45px;
            border-radius:28px;
            background:rgba(255,255,255,0.08);
            backdrop-filter:blur(25px);
            border:1px solid rgba(255,255,255,0.1);
            box-shadow:
            0 8px 32px rgba(0,0,0,0.35),
            inset 0 1px 1px rgba(255,255,255,0.08);
            z-index:10;
        }

        .top{
            display:flex;
            align-items:center;
            gap:18px;
            margin-bottom:30px;
        }

        .logo{
            width:70px;
            height:70px;
            border-radius:20px;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:32px;
            background:linear-gradient(135deg,#00c6ff,#0072ff);
            box-shadow:0 10px 25px rgba(0,114,255,0.4);
        }

        .heading h1{
            font-size:34px;
            font-weight:700;
        }

        .heading p{
            opacity:0.75;
            margin-top:5px;
            font-size:14px;
        }

        textarea{
            width:100%;
            height:180px;
            border:none;
            outline:none;
            resize:none;
            border-radius:20px;
            padding:22px;
            margin-top:10px;
            background:rgba(255,255,255,0.06);
            color:white;
            font-size:16px;
            border:1px solid rgba(255,255,255,0.08);
            transition:0.3s;
        }

        textarea:focus{
            border:1px solid #00c6ff;
            box-shadow:0 0 20px #00c6ff40;
        }

        textarea::placeholder{
            color:#cbd5e1;
        }

        .button-area{
            display:flex;
            justify-content:center;
            margin-top:28px;
        }

        button{
            padding:15px 42px;
            border:none;
            border-radius:14px;
            font-size:17px;
            font-weight:600;
            cursor:pointer;
            color:white;
            background:linear-gradient(135deg,#00c6ff,#0072ff);
            transition:0.35s;
            box-shadow:0 12px 25px rgba(0,114,255,0.35);
        }

        button:hover{
            transform:translateY(-4px) scale(1.02);
            box-shadow:0 18px 35px rgba(0,114,255,0.5);
        }

        .result-box{
            margin-top:35px;
            padding:22px;
            border-radius:18px;
            background:rgba(255,255,255,0.05);
            border:1px solid rgba(255,255,255,0.08);
            text-align:center;
        }

        .result-title{
            font-size:14px;
            letter-spacing:1px;
            opacity:0.7;
            margin-bottom:10px;
        }

        .result{
            font-size:28px;
            font-weight:700;
        }

        .footer{
            margin-top:28px;
            text-align:center;
            opacity:0.6;
            font-size:13px;
        }

        @media(max-width:768px){

            .container{
                width:92%;
                padding:28px;
            }

            .heading h1{
                font-size:26px;
            }

            textarea{
                height:160px;
            }
        }

    </style>

</head>

<body>

    <div class="bg-animation"></div>
    <div class="bg-animation"></div>

    <div class="container">

        <div class="top">

            <div class="logo">
                🛡️
            </div>

            <div class="heading">

                <h1>Scam SMS Detector</h1>

                <p>
                    AI-powered NLP system to classify spam and safe SMS messages
                </p>

            </div>

        </div>

        <form method="POST">

            <textarea
                name="message"
                placeholder="Paste suspicious SMS here..."
            ></textarea>

            <div class="button-area">

                <button type="submit">
                    Detect Message
                </button>

            </div>

        </form>

        <div class="result-box">

            <div class="result-title">
                DETECTION RESULT
            </div>

            <div class="result">
                {{ prediction }}
            </div>

        </div>

        <div class="footer">
            Built with Flask • NLP • Machine Learning
        </div>

    </div>

</body>

</html>
