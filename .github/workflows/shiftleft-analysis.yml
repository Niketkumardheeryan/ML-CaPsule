name: SL Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: 
  schedule:
    - cron: '23 16 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  Scan-Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Convert Notebooks and Nuclear Cleanup
      run: |
        pip install nbconvert
        
        # 1. Convert all notebooks to pure Python scripts
        find . -name "*.ipynb" -exec jupyter nbconvert --to script {} \; || true
        
        # 2. WIPE GIT HISTORY AND VIRTUAL ENVIRONMENTS
        # This stops the scanner from reading old commits or heavy libraries
        rm -rf .git .venv venv env node_modules
        
        # 3. NUKE EVERYTHING EXCEPT PYTHON FILES
        # This deletes every single file in the directory that does NOT end in .py
        # Datasets, images, HTML, logs, JSONs, lockfiles - all instantly gone.
        find . -type f ! -name "*.py" -delete
        
        # (Optional) See what is left to prove it worked!
        echo "Files remaining for the scanner:"
        find . -type f

    - name: Perform Scan
      uses: ShiftLeftSecurity/scan-action@master
      env:
        WORKSPACE: ""
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SCAN_AUTO_BUILD: false
      with:
        output: reports
        type: python,credscan

    - name: Fix SARIF URIs (Make paths relative)
      run: |
        sudo sed -i 's|file:///github/workspace/||g' reports/*.sarif
        sudo sed -i 's|/github/workspace/||g' reports/*.sarif

    - name: Upload report
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: reports
# Forcing GitHub PR to refresh diff
