name: SL Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: 
  schedule:
    - cron: '23 16 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  Scan-Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Convert Notebooks and Clean Files
      run: |
        pip install nbconvert
        
        # 1. Convert all notebooks to pure Python scripts
        find . -name "*.ipynb" -exec jupyter nbconvert --to script {} \; || true
        
        # 2. Delete the original notebooks
        find . -type f -name "*.ipynb" -delete
        
        # 3. Delete all Images and SVGs
        find . -type f -name "*.svg" -delete
        find . -type f -name "*.png" -delete
        find . -type f -name "*.jpg" -delete
        find . -type f -name "*.jpeg" -delete
        find . -type f -name "*.gif" -delete
        
        # 4. Delete PDFs, HTML reports, and Document binaries
        find . -type f -name "*.pdf" -delete
        find . -type f -name "*.doc*" -delete
        find . -type f -name "*.html" -delete
        
        # 5. Delete heavy ML models, datasets, and logs
        find . -type f -name "*.pkl" -delete
        find . -type f -name "*.h5" -delete
        find . -type f -name "*.pth" -delete
        find . -type f -name "*.joblib" -delete
        find . -type f -name "*.csv" -delete
        find . -type f -name "*.tsv" -delete
        find . -type f -name "*.log" -delete
        find . -type f -name "*.yaml" -delete
        find . -type f -name "*.yml" -delete
        
        # 6. Delete Dockerfiles and infrastructure
        find . -type f -iname "*dockerfile*" -delete
        find . -type f -name ".dockerignore" -delete
        find . -type f -iname "makefile" -delete
        
        # 7. Delete Lockfiles (Crucial to prevent thousands of fake secret alerts!)
        find . -type f -name "*lock*" -delete

    - name: Perform Scan
      uses: ShiftLeftSecurity/scan-action@master
      env:
        WORKSPACE: ""
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SCAN_AUTO_BUILD: false
      with:
        output: reports
        type: python,credscan

    - name: Fix SARIF URIs (Make paths relative)
      run: |
        sudo sed -i 's|file:///github/workspace/||g' reports/*.sarif
        sudo sed -i 's|/github/workspace/||g' reports/*.sarif

    - name: Upload report
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: reports
