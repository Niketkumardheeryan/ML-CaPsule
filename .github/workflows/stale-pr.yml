name: Stale PR Lifecycle (Warn 21d, Close 30d / Testable)

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and act on stale PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const WARNING_LABEL = 'stale-warning-21d';
            const NO_ACTIVITY_LABEL = 'noActivity';

            const warningAfterDays = 21;
            const closeAfterDays = 30;

            const now = Date.now();

            const warningMs = warningAfterDays * 24 * 60 * 60 * 1000;
            const closeMs = closeAfterDays * 24 * 60 * 60 * 1000;

            // User-facing message only (defaults)
            const warningThresholdText = `${warningAfterDays} day(s)`;
            const closeThresholdText = `${closeAfterDays} day(s)`;
            const closeInText = `${Math.max(0, closeAfterDays - warningAfterDays)} day(s)`; // 30 - 21 = 9 days

            // How many milliseconds from warning -> close. Used for closure gating.
            const closeInMs = Math.max(0, closeAfterDays - warningAfterDays) * 24 * 60 * 60 * 1000;

            // Helper: ensure label exists (ignore errors if it already exists / label doesn't exist)
            async function ensureLabel(name, color = 'ededed') {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color });
                } else {
                  throw e;
                }
              }
            }

            await ensureLabel(WARNING_LABEL, 'f9d0c4');
            await ensureLabel(NO_ACTIVITY_LABEL, 'cccccc');

            // List open PRs
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            for (const pr of prs) {
              const prNumber = pr.number;

              // Only consider PRs with at least one APPROVED/CHANGES_REQUESTED (non-PENDING) review from a maintainer/collaborator.
              // We approximate "maintainer/collaborator" by requiring repo permission to be one of: write/maintain/admin.

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100
              });

              let hasMaintainerReview = false;
              for (const r of reviews) {
                if (!r.state || r.state === 'PENDING') continue;

                // Use GitHub-provided association to avoid extra API calls / rate limiting.
                const assoc = r.author_association;
                if (assoc === 'OWNER' || assoc === 'MEMBER' || assoc === 'COLLABORATOR') {
                  hasMaintainerReview = true;
                  break;
                }
              }

              const lastUpdated = new Date(pr.updated_at).getTime();

              const ageMs = now - lastUpdated;

              const labels = (pr.labels || []).map(l => l.name);

              // Warning: when inactivity exceeds warning threshold (21 days)
              if (hasMaintainerReview && ageMs >= warningMs && ageMs < closeMs) {
                if (!labels.includes(WARNING_LABEL)) {
                  const warningBody = `This PR has been marked as stale due to ${warningThresholdText} of inactivity after a review. It will be closed in ${closeInText} if there are no further updates.`;

                  // Store the computed body text so closure logic can match it later.
                  // (Used below when scanning comments.)
                  const warningBodySignature = warningBody;

                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body: warningBodySignature
                  });

                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: prNumber,
                    labels: [WARNING_LABEL]
                  });
                }
              }

              // Closure: do NOT use `pr.updated_at` because this workflow's own warning comment/label updates it.
              // Instead, base closure timing on when the warning label was applied (first time we see the warning comment).
              //
              // We approximate "no further updates" by ensuring the PR has not been updated since the warning comment was posted.
              // (If only the bot actions occurred after the warning, this will still hold in practice because we close once the window expires.)
              if (pr.state === 'open' && labels.includes(WARNING_LABEL) && !labels.includes(NO_ACTIVITY_LABEL)) {
                // Find the warning comment timestamp by scanning recent comments.
                // IMPORTANT: closure gating must not depend on bot-updating `pr.updated_at`.
                const comments = await github.paginate(github.rest.issues.listComments, {
                  owner,
                  repo,
                  issue_number: prNumber,
                  per_page: 100
                });

                const warningComment = comments
                  .filter(c => c && c.user)
                  .find(c => (c.body || '').includes('This PR has been marked as stale due to') && (c.body || '').includes('will be closed in'));

                const warningTimestamp = warningComment ? new Date(warningComment.created_at).getTime() : null;

                // If we can't locate the warning comment, do nothing (keeps lifecycle consistent and avoids unintended closes).
                if (warningTimestamp !== null) {
                  const timeSinceWarningMs = now - warningTimestamp;
                  const shouldClose = timeSinceWarningMs >= closeInMs;

                  if (shouldClose) {
                    // Remove contributor assignment when closing.
                    // Avoid unassigning all assignees/maintainers, since that can disrupt attribution.
                    const issue = await github.rest.issues.get({ owner, repo, issue_number: prNumber });
                    const assignees = issue.data.assignees || [];
                    const prAuthor = pr.user && pr.user.login;

                    if (prAuthor && assignees.some(a => a.login === prAuthor)) {
                      await github.rest.issues.removeAssignees({
                        owner,
                        repo,
                        issue_number: prNumber,
                        assignees: [prAuthor]
                      });
                    }

                    const finalComment = `This PR has been marked as abandoned due to ${closeThresholdText} of inactivity. Closing it now.`;

                    await github.rest.issues.createComment({
                      owner,
                      repo,
                      issue_number: prNumber,
                      body: finalComment
                    });

                    await github.rest.issues.addLabels({
                      owner,
                      repo,
                      issue_number: prNumber,
                      labels: [NO_ACTIVITY_LABEL]
                    });

                    await github.rest.pulls.update({
                      owner,
                      repo,
                      pull_number: prNumber,
                      state: 'closed'
                    });
                  }
                }
              }
            }



