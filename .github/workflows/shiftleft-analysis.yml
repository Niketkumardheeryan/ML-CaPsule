# This workflow integrates Scan with GitHub's code scanning feature
# Scan is a free open-source security tool for modern DevOps teams from ShiftLeft
# Visit https://slscan.io/en/latest/integrations/code-scan for help
name: SL Scan

on:
  push:
    branches: [ master ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ master ]
  schedule:
    - cron: '23 16 * * 1'

jobs:
  Scan-Build:
    # Scan runs on ubuntu, mac and windows
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    # Instructions
    # 1. Setup JDK, Node.js, Python etc depending on your project type
    # 2. Compile or build the project before invoking scan
    #    Example: mvn compile, or npm install or pip install goes here
    # 3. Invoke Scan with the github token. Leave the workspace empty to use relative url

    - name: Perform Scan
      uses: ShiftLeftSecurity/scan-action@master
      env:
        WORKSPACE: ""
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SCAN_AUTO_BUILD: true
      with:
        output: reports
        # Scan auto-detects the languages in your project. To override uncomment the below variable and set the type
        # type: credscan,java
        # type: python

    - name: Reduce SARIF size for upload
      shell: bash
      run: |
        shopt -s nullglob
        sarif_files=(reports/*.sarif)
        if [ ${#sarif_files[@]} -eq 0 ]; then
          echo "No SARIF files found in reports/"
          exit 0
        fi
        for sarif in "${sarif_files[@]}"; do
          tmp_file="$(mktemp)"
          jq '.runs |= map(.results = ((.results // [])[:1000] | map(del(.codeFlows, .stacks, .graphs))) | .artifacts = ((.artifacts // [])[:1000]))' "$sarif" > "$tmp_file"
          mv "$tmp_file" "$sarif"
        done

    - name: Upload report
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: reports
