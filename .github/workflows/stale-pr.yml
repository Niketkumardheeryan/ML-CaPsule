name: Stale PR Lifecycle (Warn 21d, Close 30d)

on:
  schedule:
    - cron: "30 1 * * *"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate and act on stale PRs
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const WARNING_LABEL = 'stale-warning-21d';
            const NO_ACTIVITY_LABEL = 'noActivity';

            const warningAfterDays = 21;
            const closeAfterDays = 30;

            const now = Date.now();
            const warningMs = warningAfterDays * 24 * 60 * 60 * 1000;
            const closeMs = closeAfterDays * 24 * 60 * 60 * 1000;

            // Helper: ensure label exists (ignore errors if it already exists / label doesn't exist)
            async function ensureLabel(name, color = 'ededed') {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch (e) {
                if (e.status === 404) {
                  await github.rest.issues.createLabel({ owner, repo, name, color });
                } else {
                  throw e;
                }
              }
            }

            await ensureLabel(WARNING_LABEL, 'f9d0c4');
            await ensureLabel(NO_ACTIVITY_LABEL, 'cccccc');

            // List open PRs
            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            for (const pr of prs) {
              const prNumber = pr.number;

              // Only consider PRs with at least one APPROVED/CHANGES_REQUESTED review from a maintainer/collaborator.
              // We approximate "maintainer/collaborator" by requiring repo permission to be one of: write/maintain/admin.
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: prNumber,
                per_page: 100
              });

              let hasMaintainerReview = false;
              for (const r of reviews) {
                if (!r.state) continue;
                if (r.state === 'PENDING') continue;

                const reviewer = r.user && r.user.login;
                if (!reviewer) continue;

                // Requires the `issues`/`pull-requests` token permissions we already granted.
                const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner,
                  repo,
                  username: reviewer
                });

                const level = (perm.data && perm.data.permission) ? perm.data.permission : null;
                if (level === 'write' || level === 'maintain' || level === 'admin') {
                  hasMaintainerReview = true;
                  break;
                }
              }

              if (!hasMaintainerReview) continue;


              const lastUpdated = new Date(pr.updated_at).getTime();
              const ageMs = now - lastUpdated;

              // 21-day warning: PR is at least warningAfterDays inactive, and warning label not set yet
              if (ageMs >= warningMs && ageMs < closeMs) {
                const labels = (pr.labels || []).map(l => l.name);
                if (!labels.includes(WARNING_LABEL)) {
                  const warningBody = `This PR has been marked as stale due to 3 weeks of inactivity after a review. It will be closed in 9 days if there are no further updates.`;

                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body: warningBody
                  });

                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: prNumber,
                    labels: [WARNING_LABEL]
                  });
                }
              }

              // 30-day closure: PR is at least closeAfterDays inactive
              if (ageMs >= closeMs) {
                // If already closed by a previous run, skip
                if (pr.state !== 'open') continue;

                const labels = (pr.labels || []).map(l => l.name);
                // If already labeled / closed previously, don't repeat.
                if (!labels.includes(NO_ACTIVITY_LABEL)) {
                  // Remove assignees (unassign contributor)
                  const issue = await github.rest.issues.get({ owner, repo, issue_number: prNumber });
                  const assignees = issue.data.assignees || [];
                  const assigneeLogins = assignees.map(a => a.login);
                  if (assigneeLogins.length > 0) {
                    await github.rest.issues.removeAssignees({
                      owner,
                      repo,
                      issue_number: prNumber,
                      assignees: assigneeLogins
                    });
                  }

                  const finalComment = `This PR has been marked as abandoned due to 1 month of inactivity after review. Closing it now.`;
                  await github.rest.issues.createComment({
                    owner,
                    repo,
                    issue_number: prNumber,
                    body: finalComment
                  });

                  await github.rest.issues.addLabels({
                    owner,
                    repo,
                    issue_number: prNumber,
                    labels: [NO_ACTIVITY_LABEL]
                  });
                }

                await github.rest.pulls.update({
                  owner,
                  repo,
                  pull_number: prNumber,
                  state: 'closed'
                });
              }
            }

