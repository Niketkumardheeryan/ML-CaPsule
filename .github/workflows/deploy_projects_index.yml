name: Build Project Index Site

on:
  push:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Generate docs site assets
        run: |
          python scripts/generate_index.py
      - name: Verify docs folder
        run: |
          ls -la docs
