name: SL Scan

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: 
  schedule:
    - cron: '23 16 * * 1'

permissions:
  security-events: write
  actions: read
  contents: read

jobs:
  Scan-Build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # FIX 1: Convert Notebooks to clean Python code and delete the noisy JSON/data files
    - name: Convert Notebooks and Clean Data
      run: |
        # Install Jupyter's official conversion tool
        pip install nbconvert
        
        # Convert all notebooks to pure .py files (ignores corrupted notebooks)
        find . -name "*.ipynb" -exec jupyter nbconvert --to script {} \; || true
        
        # Delete the original notebooks and heavy data files so the scanner ignores them
        find . -name "*.ipynb" -type f -delete
        find . -name "*.csv" -type f -delete
        find . -name "*.json" -type f -delete
        find . -name "*.pkl" -type f -delete
        find . -name "*.h5" -type f -delete
        find . -name "*.txt" -type f -delete

    - name: Perform Scan
      uses: ShiftLeftSecurity/scan-action@master
      env:
        WORKSPACE: ""
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SCAN_AUTO_BUILD: false
      with:
        output: reports
        type: python,credscan

    - name: Fix SARIF URIs (Make paths relative)
      run: |
        sudo sed -i 's|file:///github/workspace/||g' reports/*.sarif
        sudo sed -i 's|/github/workspace/||g' reports/*.sarif

    # FIX 2: Upgraded to v4 to completely remove the Node 20 warnings!
    - name: Upload report
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: reports
